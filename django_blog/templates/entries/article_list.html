{% extends "base.html" %}

{% block title %}Статьи · OldSchool Journal{% endblock %}

{% block content %}
    <h1>Статьи</h1>
    {% for article in article_list %}
        <article class="card entry">
            <h2><a href="{% url 'article_detail' article.pk %}">{{ article.title }}</a></h2>
            <p>{{ article.content|truncatewords:32 }}</p>
        </article>
    {% empty %}
        <p class="card">Статей пока нет.</p>
    {% endfor %}
{% endblock %}
