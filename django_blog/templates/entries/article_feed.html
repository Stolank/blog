<div class="article-feed">
    {% for article in articles %}
        <article class="article-teaser">
            <time datetime="{{ article.published_at|date:'c' }}" class="article-date">{{ article.published_at|date:"j E Y" }}</time>
            <div>
                {% if under_section %}
                    <h3><a href="{{ article.get_absolute_url }}">{{ article.title }}</a></h3>
                {% else %}
                    <h2><a href="{{ article.get_absolute_url }}">{{ article.title }}</a></h2>
                {% endif %}
                <p>{{ article.content|truncatewords:28 }}</p>
            </div>
        </article>
    {% empty %}
        <p class="article-empty">Статей пока нет.</p>
    {% endfor %}
</div>
