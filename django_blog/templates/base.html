{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OldSchool Journal{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'journal.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-row">
            <a class="brand" href="{% url 'home' %}">OldSchool Journal</a>
            <nav class="nav" aria-label="Главное меню">
                {% with page=request.resolver_match.url_name %}
                    <a href="{% url 'home' %}"{% if page == 'home' %} aria-current="page"{% endif %}>Главная</a>
                    <a href="{% url 'article_list' %}"{% if page == 'article_list' %} aria-current="page"{% elif page == 'article_detail' %} aria-current="location"{% endif %}>Статьи</a>
                    <a href="{% url 'city_list' %}"{% if page == 'city_list' %} aria-current="page"{% elif page == 'city_detail' %} aria-current="location"{% endif %}>Города</a>
                {% endwith %}
            </nav>
        </div>
    </header>
    <main class="container" id="main">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">© {% now "Y" %} OldSchool Journal</div>
    </footer>
</body>
</html>
